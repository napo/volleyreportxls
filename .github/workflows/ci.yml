name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Licenze di ogni file (REUSE)
        uses: fsfe/reuse-action@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stessa versione in tutti i file
        run: node scripts/check-version.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
