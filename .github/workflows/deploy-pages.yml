name: Versione web (GitHub Pages)

# The web version follows the releases: it is published when a version tag is pushed
# (or by hand), so https://report.volleyserve.it always matches the latest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Required by actions/deploy-pages v4 and later.
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Il tag corrisponde alla versione
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "$GITHUB_REF_NAME"
      - run: npm test
      - uses: actions/configure-pages@v6
      # Custom domain (public/CNAME): the app is served from the site root, base "/".
      - run: npm run build
      - name: Dominio personalizzato
        run: test "$(cat dist/CNAME)" = "report.volleyserve.it"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
