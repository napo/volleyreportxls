name: Build applicazioni

# Installers for Windows, macOS, Linux, Android and iOS (unsigned IPA), built when a version tag (vX.Y.Z) is pushed;
# the release job then publishes them, with the updater manifest, as a GitHub Release.
# Can also be started by hand (Actions → Build applicazioni → Run workflow) to test the builds:
# without a tag nothing is published, the packages stay as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Versione
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Il tag corrisponde alla versione di package.json, tauri.conf.json e Cargo
        run: node scripts/check-version.mjs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  desktop:
    name: Desktop · ${{ matrix.name }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macOS-Apple-Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: macOS-Intel
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: Linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm test
      - name: Build installer
        shell: bash
        run: |
          # Updater files (signatures) only when the signing key is available
          extra=()
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then extra=(--config '{"bundle":{"createUpdaterArtifacts":false}}'); fi
          npm run desktop:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} "${extra[@]}" --ci -- --locked
        env:
          # Ad hoc signature: a usable macOS app without Apple notarisation
          APPLE_SIGNING_IDENTITY: '-'
          # Signature of the automatic updates (key kept in ~/.tauri-keys, see docs/builds.md)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Raccogli pacchetti e file di aggiornamento
        shell: bash
        run: node scripts/collect-desktop.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: VolleyReport-${{ matrix.name }}
          if-no-files-found: error
          path: desktop-dist/*

  android:
    name: Android · APK
    needs: version
    runs-on: ubuntu-22.04
    env:
      NDK_VERSION: '27.2.12479018'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android
      - name: SDK e NDK
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run tauri -- android init --ci --skip-targets-install
      - name: Firma release (facoltativa)
        run: python3 scripts/android-signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: APK debug, installabile senza firma
        run: npm run android:build -- --debug --apk --target aarch64 armv7 x86_64 --ci -- --locked
      - name: APK release (se firmato)
        continue-on-error: true
        run: npm run android:build -- --apk --target aarch64 armv7 x86_64 --ci -- --locked
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Nomi dei pacchetti come le altre build
        env:
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          base="VolleyReport_${version}_android-universal"
          out=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p android-dist
          release_apk=$(find "$out" -path '*/release/*' -name '*.apk' | head -n 1)
          debug_apk=$(find "$out" -path '*/debug/*' -name '*.apk' | head -n 1)
          if [ "$SIGNED" = "true" ] && [ -n "$release_apk" ]; then
            cp "$release_apk" "android-dist/${base}.apk"
          else
            cp "$debug_apk" "android-dist/${base}-debug.apk"
          fi
          ls -lah android-dist
      - uses: actions/upload-artifact@v7
        with:
          name: VolleyReport-Android
          if-no-files-found: error
          path: android-dist/*
      - name: Rimuovi chiave temporanea
        if: always()
        run: rm -f src-tauri/gen/android/release.jks

  ios:
    name: iPhone e iPad · IPA non firmato
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: aarch64-apple-ios
      - run: npm ci
      - run: npm run tauri -- ios init --ci --skip-targets-install
      - name: Build iOS/iPadOS senza credenziali Apple
        run: npm run tauri -- ios build --target aarch64 --no-sign --ci -- --locked
      # Unsigned IPA for sideloading (AltStore, Sideloadly, TrollStore): the .app inside a Payload folder.
      - name: Pacchetto IPA
        run: |
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          VERSION=$(node -p "require('./package.json').version")
          zip -qr "VolleyReport_${VERSION}_iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v7
        with:
          name: VolleyReport-iOS
          if-no-files-found: error
          path: VolleyReport_*_iOS-unsigned.ipa

  release:
    name: Release su GitHub
    # iOS is optional: if its build fails, the release goes out without the IPA.
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.desktop.result == 'success' && needs.android.result == 'success'
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: VolleyReport-*
          merge-multiple: true
      - name: Raccogli i file della release
        run: |
          mkdir -p release-files
          find release-assets/ -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.rpm" \
            -o -name "*.AppImage" -o -name "*.apk" -o -name "*.ipa" -o -name "*.app.tar.gz" -o -name "*.sig" \) -exec cp {} release-files/ \;
          ls -lah release-files/
      - name: Manifest degli aggiornamenti automatici (latest.json)
        run: node scripts/updater-manifest.mjs release-files "${GITHUB_REF_NAME}"
      - uses: softprops/action-gh-release@v3
        with:
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
