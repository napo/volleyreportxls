# SPDX-License-Identifier: AGPL-3.0-or-later

# Licences of the files that cannot carry an SPDX header (images, fonts,
# JSON, binaries) or that are generated. See https://reuse.software.
version = 1
SPDX-PackageName = "VolleyReport"
SPDX-PackageDownloadLocation = "https://github.com/napo/volleyreportxls"

# Configuration and lock files: part of the software.
[[annotations]]
path = [
  "package.json",
  "package-lock.json",
  "tsconfig.json",
  "public/CNAME",
  "src-tauri/Cargo.lock",
  "src-tauri/tauri.conf.json",
  "src-tauri/capabilities/*.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Maurizio Napolitano <maurizio.napolitano@gmail.com>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Content that is not software: images, app icons (generated from the logo),
# the original spreadsheet, sample photos and PDFs, the fixture extracted from
# the spreadsheet.
[[annotations]]
path = [
  "VolleyReportXLS.xlsx",
  "raw_data/**",
  "docs/examples/**",
  "public/*.png",
  "src/assets/*.png",
  "src/assets/howto/**",
  "src-tauri/app-icon.png",
  "src-tauri/icons/**",
  "src/oracle/volleyreportxls-oracle.json",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Maurizio Napolitano <maurizio.napolitano@gmail.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# Third party: fonts (SIL Open Font License).
[[annotations]]
path = ["src/assets/fonts/Roboto-*.ttf", "src/assets/fonts/OFL-Roboto.txt", "public/licenses/OFL-Roboto.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["src/assets/fonts/Montserrat-*.ttf", "src/assets/fonts/OFL-Montserrat.txt", "public/licenses/OFL-Montserrat.txt"]
precedence = "override"
SPDX-FileCopyrightText = [
  "2011 The Montserrat Project Authors (https://github.com/JulietaUla/Montserrat)",
  "2024 The Montserrat.Git Project Authors (https://github.com/JulietaUla/Montserrat.git)",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "public/licenses/OFL-Rubik.txt"
precedence = "override"
SPDX-FileCopyrightText = "2015 The Rubik Project Authors (https://github.com/googlefonts/rubik)"
SPDX-License-Identifier = "OFL-1.1"

# Third party: PayPal wordmark from the Tabler payment icons. PayPal is a
# trademark of PayPal, Inc.: the licence covers the drawing, not the mark.
[[annotations]]
path = "src/assets/paypal.svg"
precedence = "override"
SPDX-FileCopyrightText = "2024 Paweł Kuna (https://github.com/tabler/tabler-payments)"
SPDX-License-Identifier = "MIT"
